<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Collapse first gives acid and alkoxide</title><desc>Collapse first gives acid and alkoxide</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="115" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">CH₃C(O⁻)(OH)(OEt)</text>
<line x1="480" y1="145" x2="480" y2="220" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="265" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">CH₃COOH + EtO⁻</text>
<text x="480" y="355" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">Et = CH₂CH₃; the next acid–base step must still be considered.</text>
</svg>