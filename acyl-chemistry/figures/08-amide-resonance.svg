<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Amide nitrogen donates into the carbonyl</title><desc>Amide nitrogen donates into the carbonyl</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="245" y="170" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">R–C(=O)–NH₂</text>
<text x="730" y="170" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">R–C(–O⁻)=NH₂⁺</text>
<line x1="425" y1="160" x2="535" y2="160" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="480" y="285" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">Partial C–N double-bond character limits rotation.</text>
<text x="480" y="340" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">Contributors describe one amide; N lone pair is less available.</text>
</svg>