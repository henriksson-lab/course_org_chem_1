<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>An ester contains an adjacent carbonyl; an ether does not</title><desc>An ester contains an adjacent carbonyl; an ether does not</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="245" y="150" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">CH₃–C(=O)–O–CH₂CH₃</text>
<text x="730" y="150" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH₂–O–CH₂CH₃</text>
<rect x="150" y="200" width="200" height="5" rx="8" fill="#176b91" stroke="none"/>
<text x="245" y="280" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">acyl C–O linkage</text>
<text x="730" y="280" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">no carbonyl carbon</text>
</svg>