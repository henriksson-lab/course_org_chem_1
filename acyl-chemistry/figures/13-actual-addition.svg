<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Hydroxide addition opens the ester carbonyl</title><desc>Hydroxide addition opens the ester carbonyl</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="225" y="200" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">C</text>
<text x="225" y="102" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">O</text>
<line x1="220" y1="170" x2="220" y2="122" stroke="#153747" stroke-width="3"/>
<line x1="230" y1="170" x2="230" y2="122" stroke="#153747" stroke-width="3"/>
<line x1="205" y1="190" x2="145" y2="215" stroke="#153747" stroke-width="3"/>
<text x="135" y="225" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="end" font-weight="normal">CH₃</text>
<line x1="245" y1="190" x2="305" y2="215" stroke="#153747" stroke-width="3"/>
<text x="315" y="225" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="start" font-weight="normal">OEt</text>
<text x="710" y="200" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">C</text>
<text x="710" y="102" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">O⁻</text>
<line x1="705" y1="170" x2="705" y2="122" stroke="#153747" stroke-width="3"/>
<line x1="690" y1="190" x2="630" y2="215" stroke="#153747" stroke-width="3"/>
<text x="620" y="225" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="end" font-weight="normal">CH₃</text>
<line x1="730" y1="190" x2="790" y2="215" stroke="#153747" stroke-width="3"/>
<text x="800" y="225" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="start" font-weight="normal">OEt</text>
<line x1="710" y1="212" x2="710" y2="260" stroke="#153747" stroke-width="3"/>
<text x="710" y="300" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">OH</text>
<line x1="400" y1="190" x2="515" y2="190" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="125" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">+ OH⁻</text>
<text x="480" y="370" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">The incoming oxygen is OH; the original carbonyl oxygen is O⁻.</text>
</svg>