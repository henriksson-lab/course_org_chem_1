<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Rank the two carbon branches at lactic acid stereocentre</title><desc>Rank the two carbon branches at lactic acid stereocentre</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="260" y="130" font-family="DejaVu Sans, sans-serif" font-size="40" fill="#153747" text-anchor="middle" font-weight="normal">–COOH</text>
<text x="710" y="130" font-family="DejaVu Sans, sans-serif" font-size="40" fill="#153747" text-anchor="middle" font-weight="normal">–CH₃</text>
<text x="260" y="235" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#153747" text-anchor="middle" font-weight="normal">next atoms: O, O, O</text>
<text x="710" y="235" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#153747" text-anchor="middle" font-weight="normal">next atoms: H, H, H</text>
<text x="480" y="345" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">For CIP comparison: OH &gt; COOH &gt; CH₃ &gt; H.</text>
</svg>