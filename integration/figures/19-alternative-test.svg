<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>A second candidate predicts a different methyl splitting</title><desc>A second candidate predicts a different methyl splitting</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="115" font-family="DejaVu Sans, sans-serif" font-size="39" fill="#153747" text-anchor="middle" font-weight="normal">CH₃COCH(OH)CH₃</text>
<text x="250" y="230" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">CH₃ next to CH → doublet</text>
<text x="710" y="230" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#153747" text-anchor="middle" font-weight="normal">OH-bearing CH: 1H</text>
<text x="480" y="340" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">Contrast with unknown U1: 3H triplet + O–CH₂ quartet (2H).</text>
</svg>