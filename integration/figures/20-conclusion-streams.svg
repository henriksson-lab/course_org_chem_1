<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Build a defensible conclusion from separate evidence streams</title><desc>Build a defensible conclusion from separate evidence streams</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<rect x="60" y="100" width="240" height="80" rx="8" fill="#e4f0f4" stroke="none"/>
<text x="180" y="150" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">Structure</text>
<line x1="180" y1="190" x2="480" y2="265" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="360" y="100" width="240" height="80" rx="8" fill="#e4f0f4" stroke="none"/>
<text x="480" y="150" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">Spectra</text>
<line x1="480" y1="190" x2="480" y2="265" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="660" y="100" width="240" height="80" rx="8" fill="#e4f0f4" stroke="none"/>
<text x="780" y="150" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">Mass calculation</text>
<line x1="780" y1="190" x2="480" y2="265" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="315" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">Supported claim + stated limitation</text>
<text x="480" y="380" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="middle" font-weight="normal">A reproducible calculation does not override contradictory chemical evidence.</text>
</svg>