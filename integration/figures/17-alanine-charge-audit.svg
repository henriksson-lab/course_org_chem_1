<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Alanine net charge is the sum of its formal charges</title><desc>Alanine net charge is the sum of its formal charges</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="135" font-family="DejaVu Sans, sans-serif" font-size="42" fill="#153747" text-anchor="middle" font-weight="normal">H₃N⁺–CH(CH₃)–COO⁻</text>
<text x="250" y="250" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">N: +1</text>
<text x="710" y="250" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">COO: −1</text>
<text x="480" y="345" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">Net 0; two charged sites remain.</text>
</svg>