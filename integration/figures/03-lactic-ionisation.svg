<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Acid–base change preserves the carbon skeleton</title><desc>Acid–base change preserves the carbon skeleton</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="100" font-family="DejaVu Sans, sans-serif" font-size="33" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH(OH)COOH + OH⁻</text>
<line x1="480" y1="130" x2="480" y2="210" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="260" font-family="DejaVu Sans, sans-serif" font-size="33" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH(OH)COO⁻ + H₂O</text>
<text x="480" y="345" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">Removing the carboxyl proton does not invert the stereocentre.</text>
</svg>