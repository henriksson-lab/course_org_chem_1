<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Water protonates the alkoxide and regenerates hydroxide</title><desc>Water protonates the alkoxide and regenerates hydroxide</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="170" y="175" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH(OH)O:⁻</text>
<text x="515" y="175" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">H</text>
<text x="740" y="175" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">OH</text>
<line x1="540" y1="165" x2="705" y2="165" stroke="#153747" stroke-width="3"/>
<path d="M 300 150 Q 390 65 500 145" stroke="#176b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 620 165 Q 710 235 730 195" stroke="#176b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="480" y="300" font-family="DejaVu Sans, sans-serif" font-size="33" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH(OH)₂ + OH⁻</text>
<text x="480" y="355" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">Hydration is reversible; the equilibrium depends on the carbonyl structure.</text>
</svg>