<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>The new oxygen charge depends on its bond count</title><desc>The new oxygen charge depends on its bond count</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="220" y="130" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#153747" text-anchor="middle" font-weight="normal">CH₃OH</text>
<text x="720" y="130" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#153747" text-anchor="middle" font-weight="normal">C—O⁺HCH₃</text>
<text x="220" y="235" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">two O bonds: neutral</text>
<text x="720" y="235" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">three O bonds: +1</text>
<line x1="405" y1="120" x2="535" y2="120" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="345" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">Methanol attack adds a C—O bond before O—H deprotonation.</text>
</svg>