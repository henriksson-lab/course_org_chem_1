<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Track both oxygens through hemiacetal formation</title><desc>Track both oxygens through hemiacetal formation</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="110" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH=Oᴬ + CH₃OᴮH</text>
<line x1="360" y1="165" x2="600" y2="165" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="245" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH(OHᴬ)(OᴮCH₃)</text>
<text x="480" y="345" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">Original carbonyl oxygen A is OH; alcohol oxygen B is in OR.</text>
</svg>