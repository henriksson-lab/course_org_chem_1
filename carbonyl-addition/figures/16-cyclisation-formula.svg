<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Hemiacetal ring closure preserves all atoms</title><desc>Hemiacetal ring closure preserves all atoms</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="110" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">HO(CH₂)₄CHO  ⇌  cyclic hemiacetal</text>
<text x="240" y="225" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">before: C₅H₁₀O₂</text>
<text x="720" y="225" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">after: C₅H₁₀O₂</text>
<text x="480" y="330" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">No net H₂O is lost in this addition/proton-transfer transformation.</text>
</svg>