<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Acid catalysis begins by protonating carbonyl oxygen</title><desc>Acid catalysis begins by protonating carbonyl oxygen</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="295" y="229" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">C</text>
<line x1="288" y1="200" x2="288" y2="142" stroke="#153747" stroke-width="3"/>
<line x1="302" y1="200" x2="302" y2="142" stroke="#153747" stroke-width="3"/>
<text x="295" y="125" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#af3b45" text-anchor="middle" font-weight="normal">O</text>
<line x1="273" y1="220" x2="200" y2="247" stroke="#153747" stroke-width="3"/>
<text x="160" y="262" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#153747" text-anchor="middle" font-weight="normal">CH₃</text>
<line x1="317" y1="220" x2="407" y2="247" stroke="#153747" stroke-width="3"/>
<text x="430" y="262" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#153747" text-anchor="middle" font-weight="normal">H</text>
<text x="295" y="100" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#af3b45" text-anchor="middle" font-weight="normal">:</text>
<text x="575" y="105" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">H</text>
<text x="780" y="105" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">OH₂⁺</text>
<line x1="595" y1="95" x2="720" y2="95" stroke="#153747" stroke-width="3"/>
<path d="M 290 90 Q 420 20 560 80" stroke="#176b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 650 95 Q 710 150 742 127" stroke="#176b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="670" y="260" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH=OH⁺ + H₂O</text>
<text x="480" y="365" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">Oxygen accepts H⁺; the carbonyl carbon becomes more electrophilic.</text>
</svg>