<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Water removal can shift an acid-catalysed acetal equilibrium</title><desc>Water removal can shift an acid-catalysed acetal equilibrium</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="115" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CHO + 2 CH₃OH ⇌ CH₃CH(OCH₃)₂ + H₂O</text>
<line x1="240" y1="210" x2="720" y2="210" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="175" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">remove water: favour acetal</text>
<line x1="720" y1="285" x2="240" y2="285" stroke="#23765d" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="330" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">add excess water: favour hydrolysis</text>
<text x="480" y="380" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="middle" font-weight="normal">Acid catalyses both directions; it does not set the equilibrium constant.</text>
</svg>