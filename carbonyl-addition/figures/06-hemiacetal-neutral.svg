<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Deprotonation produces a neutral hemiacetal</title><desc>Deprotonation produces a neutral hemiacetal</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="225" y="160" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH(OH)O⁺HCH₃</text>
<line x1="425" y1="150" x2="550" y2="150" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="730" y="160" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH(OH)OCH₃</text>
<text x="480" y="95" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">water accepts the proton</text>
<text x="480" y="280" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#153747" text-anchor="middle" font-weight="normal">Oxonium + H₂O → hemiacetal + H₃O⁺</text>
<text x="480" y="345" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">The acid catalyst is regenerated; proton transfer is a real step.</text>
</svg>