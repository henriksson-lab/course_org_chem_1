<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Acid and base routes reach hydration by different first steps</title><desc>Acid and base routes reach hydration by different first steps</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="240" y="105" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">base route</text>
<text x="720" y="105" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">acid route</text>
<text x="240" y="205" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#153747" text-anchor="middle" font-weight="normal">OH⁻ adds to C</text>
<text x="720" y="205" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#153747" text-anchor="middle" font-weight="normal">O accepts H⁺ first</text>
<line x1="240" y1="240" x2="240" y2="285" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="720" y1="240" x2="720" y2="285" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="240" y="330" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">alkoxide intermediate</text>
<text x="720" y="330" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">activated carbonyl</text>
</svg>