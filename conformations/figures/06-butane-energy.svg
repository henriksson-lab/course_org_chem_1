<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Butane conformers differ in energy</title><desc>Qualitative torsional profile; anti is lowest and methyl-methyl eclipsing highest.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<line x1="105" y1="300" x2="870" y2="300" stroke="#153747" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="105" y1="300" x2="105" y2="65" stroke="#153747" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="380" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">C1–C2–C3–C4 dihedral angle (°)</text>
<text x="180" y="45" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">Relative energy (schematic)</text>
<path d="M 110.0,109.0 L 234.2,233.0 L 358.3,145.0 L 482.5,285.0 L 606.7,145.0 L 730.8,233.0 L 855.0,109.0" stroke="#176b91" stroke-width="4" fill="none"/>
<text x="110.0" y="330" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#153747" text-anchor="middle" font-weight="normal">0</text>
<text x="234.16666666666669" y="330" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#153747" text-anchor="middle" font-weight="normal">60</text>
<text x="358.33333333333337" y="330" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#153747" text-anchor="middle" font-weight="normal">120</text>
<text x="482.5" y="330" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#153747" text-anchor="middle" font-weight="normal">180</text>
<text x="606.6666666666667" y="330" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#153747" text-anchor="middle" font-weight="normal">240</text>
<text x="730.8333333333334" y="330" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#153747" text-anchor="middle" font-weight="normal">300</text>
<text x="855.0" y="330" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#153747" text-anchor="middle" font-weight="normal">360</text>
<text x="480" y="255" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">anti</text>
<text x="240" y="180" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">gauche</text>
</svg>