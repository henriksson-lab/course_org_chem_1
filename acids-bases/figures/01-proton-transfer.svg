<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>A proton transfer changes two bonds</title><desc>Hydroxide accepts the acidic proton from ethanoic acid; water and ethanoate form.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="100" y="160" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">CH₃</text>
<text x="220" y="160" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">C</text>
<text x="220" y="65" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">O</text>
<line x1="150" y1="150" x2="195" y2="150" stroke="#153747" stroke-width="3"/>
<line x1="213" y1="120" x2="213" y2="80" stroke="#153747" stroke-width="3"/>
<line x1="225" y1="120" x2="225" y2="80" stroke="#153747" stroke-width="3"/>
<line x1="245" y1="150" x2="305" y2="150" stroke="#153747" stroke-width="3"/>
<text x="330" y="160" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">O</text>
<line x1="350" y1="150" x2="405" y2="150" stroke="#153747" stroke-width="3"/>
<text x="430" y="160" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">H</text>
<text x="510" y="160" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">+</text>
<text x="600" y="160" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">O</text>
<text x="638" y="160" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">H</text>
<text x="670" y="140" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">−</text>
<circle cx="570" cy="142" r="2" stroke="#153747" fill="#176b91" stroke-width="1"/>
<circle cx="570" cy="154" r="2" stroke="#153747" fill="#176b91" stroke-width="1"/>
<path d="M 570 142 Q 500 40 435 140" stroke="#176b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 377 150 Q 375 220 333 178" stroke="#176b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="480" y="275" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#153747" text-anchor="middle" font-weight="normal">CH₃COO⁻  +  H₂O</text>
<text x="480" y="345" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">Lone pair → H; O—H bond pair → acid oxygen</text>
</svg>