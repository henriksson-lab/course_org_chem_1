<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Resonance distributes charge without moving nuclei</title><desc>Resonance distributes charge without moving nuclei</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="235" y="165" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">CH₃—C(=O)—O⁻</text>
<text x="725" y="165" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">CH₃—C(—O⁻)=O</text>
<line x1="425" y1="165" x2="530" y2="165" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="480" y="280" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#153747" text-anchor="middle" font-weight="normal">One ion, two equivalent contributors</text>
<text x="480" y="330" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">Actual C—O bonds are equivalent; the ion does not switch structures.</text>
</svg>