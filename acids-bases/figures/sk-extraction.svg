<text x="650" y="105" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#af3b45" text-anchor="start" font-weight="bold">HA between layers:</text>
<text x="650" y="135" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#af3b45" text-anchor="start" font-weight="normal">needs partition coefficient</text>
<text x="650" y="163" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#af3b45" text-anchor="start" font-weight="normal">and phase volumes</text>
<text x="650" y="285" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#23765d" text-anchor="start" font-weight="bold">HA ⇌ A⁻ in water:</text>
<text x="650" y="315" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#23765d" text-anchor="start" font-weight="normal">pKa and pH (today)</text>
<text x="480" y="400" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#5b6b75" text-anchor="middle" font-weight="normal">A⁻ stays in the water; the ionisation curve alone cannot predict recovery</text>
