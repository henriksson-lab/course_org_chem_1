<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Conjugate pairs differ by one proton</title><desc>Conjugate pairs differ by one proton</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="245" y="100" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#153747" text-anchor="middle" font-weight="normal">CH₃COOH</text>
<line x1="245" y1="130" x2="245" y2="235" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="245" y="285" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#153747" text-anchor="middle" font-weight="normal">CH₃COO⁻</text>
<text x="335" y="195" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">− H⁺</text>
<text x="715" y="100" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#153747" text-anchor="middle" font-weight="normal">CH₃NH₃⁺</text>
<line x1="715" y1="130" x2="715" y2="235" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="715" y="285" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#153747" text-anchor="middle" font-weight="normal">CH₃NH₂</text>
<text x="805" y="195" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">− H⁺</text>
<text x="480" y="355" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">The conjugate base has one less H and one less positive charge.</text>
</svg>