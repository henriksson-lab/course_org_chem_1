<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Induction stabilises a nearby negative charge</title><desc>Induction stabilises a nearby negative charge</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="240" y="130" font-family="DejaVu Sans, sans-serif" font-size="35" fill="#153747" text-anchor="middle" font-weight="normal">CH₃—COO⁻</text>
<text x="715" y="130" font-family="DejaVu Sans, sans-serif" font-size="35" fill="#153747" text-anchor="middle" font-weight="normal">ClCH₂—COO⁻</text>
<text x="240" y="220" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">CH₃COOH: pKa ≈ 4.8</text>
<text x="715" y="220" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">ClCH₂COOH: pKa ≈ 2.9</text>
<line x1="735" y1="165" x2="625" y2="165" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="315" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">Electron withdrawal stabilises the conjugate base.</text>
<text x="480" y="360" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="middle" font-weight="normal">Compare the same solvent and similar measurement conditions.</text>
</svg>