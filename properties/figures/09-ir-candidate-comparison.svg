<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Two spectral clues distinguish an alcohol and a ketone</title><desc>Two spectral clues distinguish an alcohol and a ketone</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="250" y="110" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH₂OH</text>
<text x="250" y="165" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">ethanol</text>
<path d="M 100 230 Q 160 230 190 285 Q 230 335 275 250 Q 295 230 390 230" stroke="#176b91" stroke-width="3" fill="none"/>
<text x="250" y="355" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">broad O—H; no C=O</text>
<text x="710" y="110" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">CH₃C(=O)CH₃</text>
<text x="710" y="165" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">propanone</text>
<path d="M 560 230 L 680 230 L 710 310 L 740 230 L 860 230" stroke="#23765d" stroke-width="3" fill="none"/>
<text x="710" y="355" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">strong C=O; no O—H</text>
</svg>