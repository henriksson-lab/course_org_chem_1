<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>A hydrogen bond joins donor H and acceptor lone pair</title><desc>A hydrogen bond joins donor H and acceptor lone pair</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="135" y="180" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#153747" text-anchor="middle" font-weight="normal">R</text>
<text x="225" y="180" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#153747" text-anchor="middle" font-weight="normal">O</text>
<text x="320" y="180" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#153747" text-anchor="middle" font-weight="normal">H</text>
<line x1="155" y1="167" x2="199" y2="167" stroke="#153747" stroke-width="3"/>
<line x1="250" y1="167" x2="294" y2="167" stroke="#153747" stroke-width="3"/>
<text x="600" y="180" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#153747" text-anchor="middle" font-weight="normal">O</text>
<text x="755" y="180" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#153747" text-anchor="middle" font-weight="normal">R′</text>
<text x="600" y="270" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">H</text>
<line x1="625" y1="167" x2="715" y2="167" stroke="#153747" stroke-width="3"/>
<line x1="600" y1="193" x2="600" y2="233" stroke="#153747" stroke-width="3"/>
<text x="563" y="175" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#153747" text-anchor="middle" font-weight="normal">:</text>
<line x1="345" y1="165" x2="545" y2="165" stroke="#176b91" stroke-width="3" stroke-dasharray="8 7"/>
<text x="225" y="310" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">donor O—H</text>
<text x="650" y="310" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">acceptor O lone pair</text>
<text x="480" y="355" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">Dashed contact is an intermolecular interaction, not a covalent O—H bond.</text>
</svg>