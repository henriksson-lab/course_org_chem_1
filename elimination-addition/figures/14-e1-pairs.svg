<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>E1 proton loss supplies the new carbon–carbon pi pair</title><desc>E1 proton loss supplies the new carbon–carbon pi pair</desc>
