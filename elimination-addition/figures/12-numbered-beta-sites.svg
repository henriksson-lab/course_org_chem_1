<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Number the carbon skeleton before choosing beta hydrogen</title><desc>Number the carbon skeleton before choosing beta hydrogen</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="150" font-family="DejaVu Sans, sans-serif" font-size="36" fill="#153747" text-anchor="middle" font-weight="normal">CH₃—CH(Br)—CH₂—CH₃</text>
<text x="235" y="95" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#176b91" text-anchor="middle" font-weight="normal">1</text>
<text x="235" y="240" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#af3b45" text-anchor="middle" font-weight="normal">β</text>
<text x="405" y="95" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#176b91" text-anchor="middle" font-weight="normal">2</text>
<text x="405" y="240" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#af3b45" text-anchor="middle" font-weight="normal">α</text>
<text x="585" y="95" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#176b91" text-anchor="middle" font-weight="normal">3</text>
<text x="585" y="240" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#af3b45" text-anchor="middle" font-weight="normal">β</text>
<text x="750" y="95" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#176b91" text-anchor="middle" font-weight="normal">4</text>
<text x="750" y="240" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#af3b45" text-anchor="middle" font-weight="normal"></text>
<text x="480" y="340" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">Loss at C1 makes C1=C2; loss at C3 makes C2=C3.</text>
</svg>