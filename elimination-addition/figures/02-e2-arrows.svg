<path d="M 745 170 Q 855 220 860 160" stroke="#176b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="480" y="375" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="middle" font-weight="normal">B—H forms; C—H → C=C; C—Br → Br⁻. Other C substituents omitted.</text>
