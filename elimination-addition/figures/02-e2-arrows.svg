<text x="650" y="300" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">α-carbon</text>
<path d="M 65 190 Q 160 55 280 90" stroke="#176b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
