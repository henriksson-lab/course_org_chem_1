<text x="840" y="135" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">Br</text>
<line x1="315" y1="115" x2="385" y2="200" stroke="#153747" stroke-width="3"/>
<line x1="425" y1="220" x2="620" y2="220" stroke="#153747" stroke-width="3"/>
