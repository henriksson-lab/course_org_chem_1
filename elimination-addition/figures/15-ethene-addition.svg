<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Symmetry removes a distinct regioisomeric choice</title><desc>Symmetry removes a distinct regioisomeric choice</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="225" y="155" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#153747" text-anchor="middle" font-weight="normal">CH₂=CH₂ + HBr</text>
<text x="730" y="155" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH₂Br</text>
<line x1="420" y1="145" x2="540" y2="145" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="90" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">ionic addition</text>
<text x="480" y="310" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">Either equivalent carbon assignment gives bromoethane.</text>
</svg>