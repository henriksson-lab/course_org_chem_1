<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Energy profiles of E2 and E1</title><desc>E2 has a single transition state; E1 has two transition states with a carbocation intermediate between them</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<line x1="70" y1="330" x2="70" y2="70" stroke="#153747" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="70" y1="330" x2="450" y2="330" stroke="#153747" stroke-width="2" marker-end="url(#arrow)"/>
<text x="260" y="362" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#153747" text-anchor="middle" font-weight="normal">reaction progress</text>
<text x="76" y="62" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#153747" text-anchor="start" font-weight="normal">energy</text>
<text x="260" y="34" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="bold">E2: one step</text>
<path d="M 90 260 C 190 260 220 110 265 110 C 310 110 340 290 440 290" stroke="#af3b45" stroke-width="4" fill="none"/>
<text x="265" y="96" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#af3b45" text-anchor="middle" font-weight="normal">one transition state</text>
<text x="90" y="285" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#153747" text-anchor="start" font-weight="normal">RBr + B⁻</text>
<text x="440" y="315" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#153747" text-anchor="end" font-weight="normal">alkene</text>
<line x1="530" y1="330" x2="530" y2="70" stroke="#153747" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="530" y1="330" x2="910" y2="330" stroke="#153747" stroke-width="2" marker-end="url(#arrow)"/>
<text x="720" y="362" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#153747" text-anchor="middle" font-weight="normal">reaction progress</text>
<text x="536" y="62" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#153747" text-anchor="start" font-weight="normal">energy</text>
<text x="720" y="34" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="bold">E1: two steps</text>
<path d="M 550 260 C 610 260 630 100 670 100 C 705 100 715 200 745 200 C 770 200 780 160 805 160 C 830 160 850 290 900 290" stroke="#af3b45" stroke-width="4" fill="none"/>
<text x="670" y="86" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#af3b45" text-anchor="middle" font-weight="normal">slow: C–Br breaks</text>
<text x="745" y="228" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#176b91" text-anchor="middle" font-weight="bold">carbocation</text>
<text x="550" y="285" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#153747" text-anchor="start" font-weight="normal">RBr</text>
<text x="900" y="315" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#153747" text-anchor="end" font-weight="normal">alkene</text>
</svg>