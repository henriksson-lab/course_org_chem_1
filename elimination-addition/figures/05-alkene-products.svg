<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>A secondary bromide can give more than one alkene</title><desc>A secondary bromide can give more than one alkene</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="65" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">CH₃—CH(Br)—CH₂—CH₃</text>
<line x1="420" y1="100" x2="220" y2="210" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="540" y1="100" x2="740" y2="210" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="220" y="270" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">CH₂=CHCH₂CH₃</text>
<text x="740" y="270" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH=CHCH₃</text>
<text x="220" y="325" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">but-1-ene</text>
<text x="740" y="325" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">but-2-ene (E and Z)</text>
<text x="480" y="380" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">Product proportions depend on base, geometry and conditions.</text>
</svg>