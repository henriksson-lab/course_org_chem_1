<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Mass divided by molar mass gives chemical amount</title><desc>Mass divided by molar mass gives chemical amount</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="105" font-family="DejaVu Sans, sans-serif" font-size="38" fill="#153747" text-anchor="middle" font-weight="normal">1.3812 g ÷ 138.12 g mol⁻¹</text>
<line x1="480" y1="140" x2="480" y2="220" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="270" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#153747" text-anchor="middle" font-weight="normal">0.01000 mol = 10.00 mmol</text>
<text x="480" y="355" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">The g units cancel; multiply mol by 1000 to obtain mmol.</text>
</svg>