<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Rf measures distance relative to the solvent front</title><desc>Rf measures distance relative to the solvent front</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<line x1="240" y1="310" x2="240" y2="70" stroke="#176b91" stroke-width="4"/>
<line x1="230" y1="310" x2="660" y2="310" stroke="#153747" stroke-width="3" stroke-dasharray="6 5"/>
<line x1="230" y1="90" x2="660" y2="90" stroke="#153747" stroke-width="3" stroke-dasharray="6 5"/>
<circle cx="450" cy="169" r="12" stroke="#153747" fill="#176b91" stroke-width="3"/>
<line x1="500" y1="310" x2="500" y2="169" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="700" y="185" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#153747" text-anchor="middle" font-weight="normal">spot: 3.2 cm</text>
<text x="700" y="255" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#153747" text-anchor="middle" font-weight="normal">front: 5.0 cm</text>
<text x="480" y="370" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#153747" text-anchor="middle" font-weight="normal">Rf = 3.2 / 5.0 = 0.64 (dimensionless)</text>
</svg>