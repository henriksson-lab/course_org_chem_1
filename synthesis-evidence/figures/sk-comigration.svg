<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img"><title>One spot can hide a mixture</title><desc>Lanes A, B and A plus B all show a single spot at Rf 0.64; a fourth lane shows a dashed outline for a component that the stain does not reveal</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="340" rx="12" fill="#f7fafc"/>
<rect x="230" y="20" width="500" height="260" rx="8" fill="white" stroke="#8aa0ab"/>
<line x1="242" y1="240" x2="718" y2="240" stroke="#153747" stroke-width="2" stroke-dasharray="4 5"/>
<line x1="242" y1="50.0" x2="718" y2="50.0" stroke="#176b91" stroke-width="2" stroke-dasharray="8 5"/>
<ellipse cx="292.5" cy="118.39999999999999" rx="15" ry="10" fill="#176b91"/>
<text x="292.5" y="312" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="bold">A</text>
<ellipse cx="417.5" cy="118.39999999999999" rx="15" ry="10" fill="#23765d"/>
<text x="417.5" y="312" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="bold">B</text>
<ellipse cx="542.5" cy="118.39999999999999" rx="15" ry="10" fill="#153747"/>
<text x="542.5" y="312" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="bold">A + B</text>
<ellipse cx="667.5" cy="171.6" rx="15" ry="10" fill="none" stroke="#8aa0ab" stroke-width="2" stroke-dasharray="4 3"/>
<text x="667.5" y="312" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="bold">C</text>
<text x="218" y="127.39999999999999" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="end" font-weight="normal">Rf 0.64</text>
<text x="840" y="165.6" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#8aa0ab" text-anchor="middle" font-weight="normal">C: not seen</text>
<text x="840" y="195.6" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#8aa0ab" text-anchor="middle" font-weight="normal">under UV</text>
<text x="120" y="185" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#af3b45" text-anchor="middle" font-weight="normal">same Rf,</text>
<text x="120" y="213" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#af3b45" text-anchor="middle" font-weight="normal">different</text>
<text x="120" y="241" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#af3b45" text-anchor="middle" font-weight="normal">compounds</text>
</svg>