<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Schematic proton NMR of an isolated aspirin sample with one extra signal</title><desc>Stick spectrum from 12 to 0 ppm: broad 1H acid signal near 11, four 1H aromatic signals between 7.1 and 8.1, a 3H singlet at 2.3, and an extra red singlet near 2.1</desc>
