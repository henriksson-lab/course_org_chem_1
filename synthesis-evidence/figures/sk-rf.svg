<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Rf is spot distance over front distance, both from the origin</title><desc>Left: one lane with arrows of 3.2 cm to the spot and 5.0 cm to the front, Rf 0.64. Right: a plate without a marked front, Rf cannot be calculated</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<rect x="110" y="25" width="170" height="310" rx="8" fill="white" stroke="#8aa0ab"/>
<line x1="122" y1="295" x2="268" y2="295" stroke="#153747" stroke-width="2" stroke-dasharray="4 5"/>
<line x1="122" y1="55.0" x2="268" y2="55.0" stroke="#176b91" stroke-width="2" stroke-dasharray="8 5"/>
<ellipse cx="195.0" cy="141.39999999999998" rx="15" ry="10" fill="#176b91"/>
<line x1="315" y1="295" x2="315" y2="141.39999999999998" stroke="#176b91" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="435" y1="295" x2="435" y2="55.0" stroke="#153747" stroke-width="4" marker-end="url(#arrow)"/>
<text x="325" y="218.2" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#176b91" text-anchor="start" font-weight="normal">3.2 cm</text>
<text x="445" y="170.2" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="start" font-weight="normal">5.0 cm</text>
<text x="290" y="380" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#153747" text-anchor="middle" font-weight="bold">Rf = 3.2 / 5.0 = 0.64</text>
<line x1="570" y1="25" x2="570" y2="390" stroke="#8aa0ab" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="650" y="25" width="170" height="310" rx="8" fill="white" stroke="#8aa0ab"/>
<line x1="662" y1="295" x2="808" y2="295" stroke="#153747" stroke-width="2" stroke-dasharray="4 5"/>
<ellipse cx="735.0" cy="151.0" rx="15" ry="10" fill="#176b91"/>
<line x1="855" y1="295" x2="855" y2="151.0" stroke="#176b91" stroke-width="4" marker-end="url(#arrow)"/>
<text x="865" y="223.0" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#176b91" text-anchor="start" font-weight="normal">3.0 cm</text>
<text x="735" y="72" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#af3b45" text-anchor="middle" font-weight="bold">front?</text>
<text x="765" y="380" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#af3b45" text-anchor="middle" font-weight="bold">no front: no Rf</text>
</svg>