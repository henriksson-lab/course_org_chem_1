<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>An aldehyde target requires a different stopping point</title><desc>An aldehyde target requires a different stopping point</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="170" y="160" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH₂OH</text>
<text x="480" y="160" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CHO</text>
<text x="790" y="160" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">CH₃COOH</text>
<line x1="290" y1="150" x2="370" y2="150" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="590" y1="150" x2="665" y2="150" stroke="#af3b45" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="255" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#153747" text-anchor="middle" font-weight="normal">Choose conditions for the intended endpoint</text>
<text x="480" y="345" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">An unspecified [O] arrow is not enough to guarantee aldehyde isolation.</text>
</svg>