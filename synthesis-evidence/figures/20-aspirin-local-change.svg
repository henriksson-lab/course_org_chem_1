<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>The acid group is retained while the phenolic OH is acetylated</title><desc>The acid group is retained while the phenolic OH is acetylated</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="115" font-family="DejaVu Sans, sans-serif" font-size="39" fill="#153747" text-anchor="middle" font-weight="normal">Ar–OH → Ar–O–C(=O)CH₃</text>
<line x1="200" y1="180" x2="760" y2="180" stroke="#176b91" stroke-width="3"/>
<text x="480" y="245" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">Ar–COOH remains Ar–COOH</text>
<text x="480" y="350" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">Ar denotes the same aromatic skeleton bearing adjacent COOH.</text>
</svg>