<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img"><title>The smaller n divided by coefficient limits the product</title><desc>Bar charts of reaction extent: 10.0 versus 15.0 mmol, then 10.0 versus 5.00 mmol after reducing the anhydride</desc>
