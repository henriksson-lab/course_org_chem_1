<text x="320" y="98.0" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="bold">15.0 / 1</text>
<text x="320" y="350" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="middle" font-weight="normal">anhydride</text>
<text x="170" y="258.0" font-family="DejaVu Sans, sans-serif" font-size="21" fill="white" text-anchor="middle" font-weight="bold">limits</text>
<text x="245" y="395" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#af3b45" text-anchor="middle" font-weight="normal">max aspirin 10.0 mmol = 1.80 g</text>
<text x="725" y="50" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="bold">only 0.51045 g anhydride</text>
<rect x="605.0" y="180.0" width="90" height="140.0" rx="8" fill="#dcebf1" stroke="none"/>
<text x="650" y="168.0" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="bold">10.0 / 1</text>
<text x="650" y="350" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="middle" font-weight="normal">salicylic acid</text>
<rect x="755.0" y="250.0" width="90" height="70.0" rx="8" fill="#23765d" stroke="#af3b45"/>
<text x="800" y="238.0" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="bold">5.0 / 1</text>
<text x="800" y="350" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="middle" font-weight="normal">anhydride</text>
<text x="800" y="293.0" font-family="DejaVu Sans, sans-serif" font-size="21" fill="white" text-anchor="middle" font-weight="bold">limits</text>
<text x="725" y="395" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#af3b45" text-anchor="middle" font-weight="normal">max aspirin 5.00 mmol = 0.901 g</text>
