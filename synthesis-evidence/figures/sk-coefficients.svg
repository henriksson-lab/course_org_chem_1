<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img"><title>With 2 A + B → P, divide each amount by its coefficient</title><desc>Paired bars: A 10 mmol raw becomes 5 mmol extent; B 8 mmol raw stays 8 mmol extent; A limits</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="440" rx="12" fill="#f7fafc"/>
<text x="480" y="48" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="bold">2 A + B → P</text>
<rect x="190" y="120" width="90" height="200" rx="8" fill="#dcebf1" stroke="none"/>
<text x="235" y="108" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">10 mmol</text>
<rect x="320" y="220.0" width="90" height="100.0" rx="8" fill="#af3b45" stroke="none"/>
<text x="365" y="208.0" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="bold">10/2 = 5</text>
<text x="235" y="350" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#8aa0ab" text-anchor="middle" font-weight="normal">amount n</text>
<text x="365" y="350" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#176b91" text-anchor="middle" font-weight="normal">n / coefficient</text>
<text x="300" y="386" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#153747" text-anchor="middle" font-weight="bold">A</text>
<rect x="550" y="160" width="90" height="160" rx="8" fill="#dcebf1" stroke="none"/>
<text x="595" y="148" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">8 mmol</text>
<rect x="680" y="160.0" width="90" height="160.0" rx="8" fill="#176b91" stroke="none"/>
<text x="725" y="148.0" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="bold">8/1 = 8</text>
<text x="595" y="350" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#8aa0ab" text-anchor="middle" font-weight="normal">amount n</text>
<text x="725" y="350" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#176b91" text-anchor="middle" font-weight="normal">n / coefficient</text>
<text x="660" y="386" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#153747" text-anchor="middle" font-weight="bold">B</text>
<line x1="120" y1="320" x2="840" y2="320" stroke="#153747" stroke-width="2"/>
<text x="480" y="425" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#af3b45" text-anchor="middle" font-weight="normal">A limits: extent 5 mmol, so at most 5 mmol P</text>
</svg>