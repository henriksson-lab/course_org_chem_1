<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Trace a reported result back to its observations</title><desc>Trace a reported result back to its observations</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<rect x="35" y="70" width="270" height="100" rx="8" fill="#e4f0f4" stroke="none"/>
<text x="170" y="110" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">Starting-reagent</text>
<text x="170" y="145" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#153747" text-anchor="middle" font-weight="normal">masses and molar masses</text>
<rect x="365" y="70" width="270" height="100" rx="8" fill="#e4f0f4" stroke="none"/>
<text x="500" y="110" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">Theoretical product</text>
<text x="500" y="145" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#153747" text-anchor="middle" font-weight="normal">1.8016 g</text>
<rect x="35" y="235" width="270" height="100" rx="8" fill="#e4f0f4" stroke="none"/>
<text x="170" y="275" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">Isolated mass</text>
<text x="170" y="315" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#153747" text-anchor="middle" font-weight="normal">1.20 g</text>
<rect x="660" y="235" width="270" height="100" rx="8" fill="#e4f0f4" stroke="none"/>
<text x="795" y="275" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">Isolated yield</text>
<text x="795" y="315" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#153747" text-anchor="middle" font-weight="normal">66.6%</text>
<line x1="310" y1="120" x2="360" y2="120" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="640" y1="120" x2="795" y2="225" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="310" y1="285" x2="650" y2="285" stroke="#23765d" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="385" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#153747" text-anchor="middle" font-weight="normal">Yield uses both the theoretical amount and the independently weighed isolate.</text>
</svg>