<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>E1 shares a carbocation with a possible SN1 route</title><desc>E1 shares a carbocation with a possible SN1 route</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="80" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#153747" text-anchor="middle" font-weight="normal">(CH₃)₃C⁺</text>
<line x1="440" y1="115" x2="220" y2="230" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="520" y1="115" x2="740" y2="230" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="205" y="275" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">(CH₃)₃COH</text>
<text x="750" y="275" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">(CH₃)₂C=CH₂</text>
<text x="205" y="325" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">water capture → SN1</text>
<text x="750" y="325" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">β-H loss → E1</text>
<text x="480" y="380" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">Ionisation does not by itself identify the final product.</text>
</svg>