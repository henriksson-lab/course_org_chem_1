<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Addition and elimination change the local bond inventory</title><desc>Addition and elimination change the local bond inventory</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="210" y="170" font-family="DejaVu Sans, sans-serif" font-size="42" fill="#153747" text-anchor="middle" font-weight="normal">C—C</text>
<text x="740" y="170" font-family="DejaVu Sans, sans-serif" font-size="42" fill="#153747" text-anchor="middle" font-weight="normal">C=C</text>
<line x1="360" y1="130" x2="590" y2="130" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="90" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">elimination</text>
<line x1="590" y1="220" x2="360" y2="220" stroke="#23765d" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="270" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">addition</text>
<text x="480" y="350" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">Track which σ bonds break/form and which π bond appears/disappears.</text>
</svg>