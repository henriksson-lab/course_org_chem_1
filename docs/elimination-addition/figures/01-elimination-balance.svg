<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Elimination loses groups from neighbouring carbons</title><desc>Elimination loses groups from neighbouring carbons</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="250" y="175" font-family="DejaVu Sans, sans-serif" font-size="33" fill="#153747" text-anchor="middle" font-weight="normal">CH₃—CH₂—Br</text>
<text x="720" y="175" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#153747" text-anchor="middle" font-weight="normal">CH₂=CH₂</text>
<line x1="445" y1="165" x2="540" y2="165" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="120" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">base</text>
<text x="480" y="280" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH₂Br + OH⁻ → CH₂=CH₂ + H₂O + Br⁻</text>
<text x="480" y="345" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">A formal E2 example; primary substrates can strongly favour SN2.</text>
</svg>