<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>A polar bond has unequal electron sharing</title><desc>A polar bond has unequal electron sharing</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="220" y="175" font-family="DejaVu Sans, sans-serif" font-size="44" fill="#153747" text-anchor="middle" font-weight="normal">C</text>
<text x="550" y="175" font-family="DejaVu Sans, sans-serif" font-size="44" fill="#153747" text-anchor="middle" font-weight="normal">O</text>
<line x1="255" y1="160" x2="510" y2="160" stroke="#153747" stroke-width="3"/>
<text x="220" y="110" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#af3b45" text-anchor="middle" font-weight="normal">δ+</text>
<text x="550" y="110" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#176b91" text-anchor="middle" font-weight="normal">δ−</text>
<line x1="290" y1="230" x2="495" y2="230" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="320" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">Bond dipole points toward the more electronegative atom.</text>
</svg>