<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>A carbonyl carbon has three atom neighbours and four bond orders</title><desc>A carbonyl carbon has three atom neighbours and four bond orders</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="460" y="190" font-family="DejaVu Sans, sans-serif" font-size="36" fill="#153747" text-anchor="middle" font-weight="normal">C</text>
<text x="460" y="70" font-family="DejaVu Sans, sans-serif" font-size="36" fill="#153747" text-anchor="middle" font-weight="normal">O</text>
<text x="245" y="190" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#153747" text-anchor="middle" font-weight="normal">CH₃</text>
<text x="675" y="190" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#153747" text-anchor="middle" font-weight="normal">OH</text>
<line x1="455.0" y1="150.0" x2="455.0" y2="92.0" stroke="#153747" stroke-width="3"/>
<line x1="445.0" y1="150.0" x2="445.0" y2="92.0" stroke="#153747" stroke-width="3"/>
<line x1="420" y1="180" x2="295" y2="180" stroke="#153747" stroke-width="3"/>
<line x1="495" y1="180" x2="620" y2="180" stroke="#153747" stroke-width="3"/>
<text x="480" y="285" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#153747" text-anchor="middle" font-weight="normal">CH₃C(=O)OH: two oxygens, one acidic O—H</text>
<text x="480" y="340" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">Three attached atoms; bond-order sum = 1 + 2 + 1 = 4</text>
</svg>