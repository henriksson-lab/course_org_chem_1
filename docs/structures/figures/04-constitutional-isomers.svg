<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Constitutional isomers share a formula but not connectivity</title><desc>Constitutional isomers share a formula but not connectivity</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="245" y="170" font-family="DejaVu Sans, sans-serif" font-size="35" fill="#153747" text-anchor="middle" font-weight="normal">CH₃—CH₂—OH</text>
<text x="720" y="170" font-family="DejaVu Sans, sans-serif" font-size="35" fill="#153747" text-anchor="middle" font-weight="normal">CH₃—O—CH₃</text>
<text x="245" y="245" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#153747" text-anchor="middle" font-weight="normal">ethanol: alcohol</text>
<text x="720" y="245" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#153747" text-anchor="middle" font-weight="normal">dimethyl ether: ether</text>
<text x="480" y="330" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#153747" text-anchor="middle" font-weight="normal">Both C₂H₆O; the oxygen has different neighbours.</text>
</svg>