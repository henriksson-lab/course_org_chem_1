<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Forward and reverse activation barriers have different baselines</title><desc>Forward and reverse activation barriers have different baselines</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<line x1="100" y1="315" x2="870" y2="315" stroke="#153747" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="100" y1="315" x2="100" y2="50" stroke="#153747" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 130 225 C 270 225 315 90 465 90 C 615 90 690 285 830 285" stroke="#176b91" stroke-width="4" fill="none"/>
<line x1="465" y1="225" x2="465" y2="90" stroke="#af3b45" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="630" y1="285" x2="630" y2="90" stroke="#23765d" stroke-width="3" marker-end="url(#arrow)"/>
<text x="325" y="195" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#af3b45" text-anchor="middle" font-weight="normal">45 kJ/mol</text>
<text x="745" y="190" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#23765d" text-anchor="middle" font-weight="normal">65 kJ/mol</text>
<text x="180" y="260" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">reactants: 0</text>
<text x="755" y="325" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">products: −20</text>
<text x="480" y="375" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">Same transition-state energy; different starting states.</text>
</svg>