<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img"><title>Hydride addition to acetone, then protonation by water</title><desc>Step 1: a hydride from NaBH4, drawn as H minus, adds to the carbonyl carbon of acetone and the pi pair moves to oxygen. Step 2: the alkoxide takes a proton from water, giving propan-2-ol and hydroxide.</desc>
