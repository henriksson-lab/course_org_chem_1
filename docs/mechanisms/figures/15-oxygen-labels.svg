<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Atom identity survives a proton transfer</title><desc>Atom identity survives a proton transfer</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="110" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">CH₃—Oᴬ—H + :OᴮH⁻</text>
<line x1="370" y1="170" x2="590" y2="170" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="245" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">CH₃—Oᴬ⁻ + H—Oᴮ—H</text>
<text x="480" y="345" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">Only H transfers: oxygen A stays with carbon; oxygen B becomes water.</text>
</svg>