<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>A proton transfer can neutralise an alkoxide</title><desc>A proton transfer can neutralise an alkoxide</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="160" y="170" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">:O⁻—CH₂CH₃</text>
<text x="540" y="170" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">H</text>
<text x="740" y="170" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">O—H</text>
<line x1="560" y1="160" x2="690" y2="160" stroke="#153747" stroke-width="3"/>
<path d="M 75 140 Q 280 25 525 140" stroke="#176b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 625 160 Q 690 230 715 188" stroke="#176b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="480" y="300" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH₂O⁻ + H₂O ⇌ CH₃CH₂OH + OH⁻</text>
<text x="480" y="355" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">Write a real proton donor; do not add an unexplained H⁺.</text>
</svg>