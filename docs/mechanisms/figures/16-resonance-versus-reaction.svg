<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Resonance changes electron placement, not atom connectivity</title><desc>Resonance changes electron placement, not atom connectivity</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="230" y="170" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">CH₃C(=O)O⁻</text>
<text x="730" y="170" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">CH₃C(O⁻)=O</text>
<line x1="420" y1="155" x2="540" y2="155" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="480" y="285" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">Same nuclei and same ion</text>
<text x="480" y="345" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="middle" font-weight="normal">Compare with proton transfer, which changes which atoms belong to a species.</text>
</svg>