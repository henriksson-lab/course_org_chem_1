<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Water captures the carbocation through an oxygen lone pair</title><desc>Water captures the carbocation through an oxygen lone pair</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="235" y="190" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#176b91" text-anchor="middle" font-weight="normal">H₂O:</text>
<text x="640" y="190" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#153747" text-anchor="middle" font-weight="normal">C⁺(CH₃)₃</text>
<path d="M 275 175 Q 430 65 580 160" stroke="#176b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="480" y="305" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#153747" text-anchor="middle" font-weight="normal">(CH₃)₃C—OH₂⁺</text>
<text x="480" y="355" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">The attacking water oxygen now has three bonds and charge +1.</text>
