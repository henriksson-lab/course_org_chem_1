<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>A methyl SN2 example follows a concerted pathway</title><desc>A methyl SN2 example follows a concerted pathway</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="135" y="190" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">:OH⁻</text>
<text x="420" y="190" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">CH₃</text>
<text x="690" y="190" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">Br</text>
<line x1="470" y1="180" x2="650" y2="180" stroke="#153747" stroke-width="3"/>
<path d="M 100 160 Q 240 65 385 165" stroke="#176b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 560 180 Q 645 85 688 140" stroke="#176b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="480" y="305" font-family="DejaVu Sans, sans-serif" font-size="35" fill="#153747" text-anchor="middle" font-weight="normal">CH₃OH + Br⁻</text>
<text x="480" y="360" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">Backside approach opposite the leaving group.</text>
</svg>