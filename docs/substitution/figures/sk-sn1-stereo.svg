<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img"><title>A planar carbocation gives both enantiomers</title><desc>(R)-3-bromo-3-methylhexane ionises to a flat carbocation. Water can attack either face, so both (R)- and (S)-3-methylhexan-3-ol form.</desc>
