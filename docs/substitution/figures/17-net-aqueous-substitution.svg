<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Write every species in the chosen net aqueous substitution</title><desc>Write every species in the chosen net aqueous substitution</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="130" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#153747" text-anchor="middle" font-weight="normal">(CH₃)₃CBr + 2 H₂O</text>
<line x1="350" y1="190" x2="610" y2="190" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="265" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">(CH₃)₃COH + H₃O⁺ + Br⁻</text>
<text x="480" y="355" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">The substitution branch conserves both total H atoms and charge zero.</text>
</svg>