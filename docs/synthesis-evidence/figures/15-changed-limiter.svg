<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Changing one input can change the limiting reagent</title><desc>Changing one input can change the limiting reagent</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<rect x="185" y="120" width="130" height="180" rx="8" fill="#176b91" stroke="none"/>
<text x="250" y="330" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">salicylic acid</text>
<text x="250" y="100" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#153747" text-anchor="middle" font-weight="normal">10 mmol</text>
<rect x="645" y="210" width="130" height="90" rx="8" fill="#23765d" stroke="none"/>
<text x="710" y="330" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">acetic anhydride</text>
<text x="710" y="190" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#153747" text-anchor="middle" font-weight="normal">5 mmol</text>
<text x="480" y="65" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">Alternative scenario: anhydride mass 0.51045 g</text>
<text x="480" y="380" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">Now anhydride limits aspirin to 5.00 mmol = 0.9008 g.</text>
</svg>