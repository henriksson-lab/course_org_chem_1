<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Isolated yield compares recovered mass with theoretical mass</title><desc>Isolated yield compares recovered mass with theoretical mass</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<rect x="210" y="115" width="540" height="70" rx="8" fill="#e4f0f4" stroke="none"/>
<rect x="210" y="230" width="360" height="70" rx="8" fill="#d8eee3" stroke="none"/>
<text x="480" y="160" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">Theoretical 1.8016 g</text>
<text x="390" y="275" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">Isolated 1.20 g</text>
<text x="480" y="365" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#153747" text-anchor="middle" font-weight="normal">100 × 1.20 / 1.8016 = 66.6% isolated yield</text>
</svg>