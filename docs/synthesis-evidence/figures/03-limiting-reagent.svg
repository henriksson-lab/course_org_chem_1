<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Compare amount divided by stoichiometric coefficient</title><desc>Compare amount divided by stoichiometric coefficient</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<rect x="205" y="180" width="130" height="120" rx="8" fill="#176b91" stroke="none"/>
<text x="270" y="330" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">salicylic acid</text>
<text x="270" y="165" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">10 mmol / 1</text>
<rect x="625" y="120" width="130" height="180" rx="8" fill="#23765d" stroke="none"/>
<text x="690" y="330" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">acetic anhydride</text>
<text x="690" y="105" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">15 mmol / 1</text>
<text x="480" y="65" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">The smaller amount/coefficient limits theoretical product.</text>
</svg>