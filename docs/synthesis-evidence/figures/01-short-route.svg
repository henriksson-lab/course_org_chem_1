<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Two simple transformations connect an alcohol and an ester</title><desc>Two simple transformations connect an alcohol and an ester</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="180" y="155" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH₂OH</text>
<text x="480" y="155" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">CH₃COOH</text>
<text x="790" y="155" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">CH₃COOCH₂CH₃</text>
<line x1="280" y1="145" x2="375" y2="145" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="580" y1="145" x2="650" y2="145" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="325" y="220" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">oxidation</text>
<text x="625" y="220" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">esterification</text>
<text x="480" y="330" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">Example conditions must be chosen to favour the intended transformation.</text>
</svg>