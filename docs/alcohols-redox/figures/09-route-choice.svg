<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Choose the transformation before choosing a reagent</title><desc>Choose the transformation before choosing a reagent</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="190" y="130" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH₂OH</text>
<text x="750" y="130" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CHO</text>
<line x1="340" y1="120" x2="600" y2="120" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="80" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">controlled oxidation</text>
<text x="190" y="270" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CHO</text>
<text x="750" y="270" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH₂OH</text>
<line x1="340" y1="260" x2="600" y2="260" stroke="#23765d" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="220" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">NaBH₄, then proton donor</text>
<text x="480" y="365" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">Preserving an aldehyde requires conditions that limit further oxidation.</text>
</svg>