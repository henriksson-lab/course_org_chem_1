<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>A primary alcohol can be oxidised in two stages</title><desc>A primary alcohol can be oxidised in two stages</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="170" y="180" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH₂OH</text>
<text x="480" y="180" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CHO</text>
<text x="790" y="180" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">CH₃COOH</text>
<line x1="290" y1="170" x2="365" y2="170" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="590" y1="170" x2="665" y2="170" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="330" y="120" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">[O]</text>
<text x="630" y="120" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">[O]</text>
<text x="170" y="280" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">ethanol</text>
<text x="480" y="280" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">ethanal</text>
<text x="790" y="280" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">ethanoic acid</text>
<text x="480" y="360" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="middle" font-weight="normal">[O] summarises oxidation; actual reagents and conditions must be specified.</text>
</svg>