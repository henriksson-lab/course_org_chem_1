<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Esterification replaces the acidic OH as a net transformation</title><desc>Esterification replaces the acidic OH as a net transformation</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="100" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH(OH)COOH + CH₃CH₂OH</text>
<line x1="480" y1="130" x2="480" y2="210" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="255" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH(OH)COOCH₂CH₃ + H₂O</text>
<text x="480" y="345" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">Acid-catalysed equilibrium; secondary alcohol remains in this target.</text>
</svg>