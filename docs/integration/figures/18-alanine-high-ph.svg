<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>A pH change can alter charge without changing connectivity</title><desc>A pH change can alter charge without changing connectivity</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="105" font-family="DejaVu Sans, sans-serif" font-size="38" fill="#153747" text-anchor="middle" font-weight="normal">H₃N⁺–CH(CH₃)–COO⁻</text>
<line x1="480" y1="140" x2="480" y2="215" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="270" font-family="DejaVu Sans, sans-serif" font-size="38" fill="#153747" text-anchor="middle" font-weight="normal">H₂N–CH(CH₃)–COO⁻</text>
<text x="480" y="355" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">At sufficiently high pH, ammonium loses H⁺; carbon bonds remain.</text>
</svg>