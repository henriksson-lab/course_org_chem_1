<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Oxidation changes the alcohol carbon into a carbonyl carbon</title><desc>Oxidation changes the alcohol carbon into a carbonyl carbon</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="245" y="170" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH(OH)COOH</text>
<text x="730" y="170" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">CH₃C(=O)COOH</text>
<line x1="405" y1="155" x2="570" y2="155" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="110" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">oxidation</text>
<text x="480" y="280" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">Lactic acid → pyruvic acid</text>
<text x="480" y="345" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">The former tetrahedral stereocentre becomes trigonal planar.</text>
</svg>