<text x="700" y="120" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="bold">Both attach through C: a tie.</text>
<text x="700" y="175" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#af3b45" text-anchor="middle" font-weight="normal">COOH carbon carries  (O, O, O)</text>
<text x="700" y="210" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#5b6f7a" text-anchor="middle" font-weight="normal">C=O counts O twice</text>
<text x="700" y="265" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">CH₃ carbon carries  (H, H, H)</text>
<text x="700" y="330" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#176b91" text-anchor="middle" font-weight="bold">First difference: O beats H</text>
<text x="700" y="366" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#176b91" text-anchor="middle" font-weight="normal">so COOH ranks above CH₃</text>
</svg>