<text x="390" y="235" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="end" font-weight="normal">CH₃</text>
<line x1="500" y1="200" x2="560" y2="225" stroke="#153747" stroke-width="3"/>
<text x="570" y="235" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="start" font-weight="normal">Oᵦ–Et</text>
<text x="480" y="365" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">Oₐ is carbonyl oxygen; Oᵦ is the original ester alkoxy oxygen.</text>
