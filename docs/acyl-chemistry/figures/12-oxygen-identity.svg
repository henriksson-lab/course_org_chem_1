<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Atom labels preserve oxygen identity during hydrolysis</title><desc>Atom labels preserve oxygen identity during hydrolysis</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="210" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">C</text>
<text x="480" y="112" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">Oₐ</text>
<line x1="475" y1="180" x2="475" y2="132" stroke="#153747" stroke-width="3"/>
<line x1="485" y1="180" x2="485" y2="132" stroke="#153747" stroke-width="3"/>
