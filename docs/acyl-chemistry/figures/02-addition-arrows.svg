<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="180" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">C</text>
<text x="480" y="69" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">O</text>
