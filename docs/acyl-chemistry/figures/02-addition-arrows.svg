<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Addition starts by moving the carbonyl pi pair to oxygen</title><desc>Addition starts by moving the carbonyl pi pair to oxygen</desc>
