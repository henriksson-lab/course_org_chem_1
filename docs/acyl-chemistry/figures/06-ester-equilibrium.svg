<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Acid-catalysed esterification is an equilibrium</title><desc>Acid-catalysed esterification is an equilibrium</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="115" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">CH₃COOH + HOCH₂CH₃</text>
<text x="480" y="265" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">CH₃COOCH₂CH₃ + H₂O</text>
<line x1="390" y1="155" x2="390" y2="215" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="570" y1="215" x2="570" y2="155" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="195" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">H⁺ catalyst</text>
<text x="480" y="355" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="middle" font-weight="normal">Proton transfers activate the carbonyl and make water a leaving group.</text>
</svg>