<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img"><title>Where protons appear on the shift scale</title><desc>Typical 1H shift ranges: alkyl C-H 0.9 to 1.7, H-C-C=O 2.0 to 2.6, H-C-O 3.3 to 4.3, alkene 4.6 to 6.5, aromatic 6.5 to 8, aldehyde 9.5 to 10, carboxylic acid 10 to 12 ppm</desc>
