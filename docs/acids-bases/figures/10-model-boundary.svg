<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Aqueous ionisation does not determine partition by itself</title><desc>Aqueous ionisation does not determine partition by itself</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<rect x="180" y="80" width="600" height="105" rx="8" fill="#e8edf4" stroke="none"/>
<rect x="180" y="185" width="600" height="150" rx="8" fill="#d8eee3" stroke="none"/>
<text x="480" y="135" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">Organic phase: partitioning needs more information</text>
<text x="480" y="240" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">Aqueous phase: HA ⇌ H⁺ + A⁻</text>
<text x="480" y="290" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">pH and pKa describe this acid–base ratio</text>
<text x="480" y="375" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">Extraction also depends on partition coefficients and phase volumes.</text>
</svg>