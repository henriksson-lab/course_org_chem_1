<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Use the conjugate acids to predict equilibrium</title><desc>Use the conjugate acids to predict equilibrium</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="110" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">CH₃COOH + CH₃NH₂ ⇌ CH₃COO⁻ + CH₃NH₃⁺</text>
<text x="240" y="190" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#153747" text-anchor="middle" font-weight="normal">Acid pKa ≈ 4.8</text>
<text x="730" y="190" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#153747" text-anchor="middle" font-weight="normal">Product acid pKa ≈ 10.6</text>
<line x1="220" y1="240" x2="760" y2="240" stroke="#23765d" stroke-width="5" marker-end="url(#arrow)"/>
<text x="480" y="300" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">K ≈ 10^(10.6 − 4.8) ≈ 6 × 10⁵</text>
<text x="480" y="355" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">Equilibrium favours the weaker acid/base pair.</text>
</svg>