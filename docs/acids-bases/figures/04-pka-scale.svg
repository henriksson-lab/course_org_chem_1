<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>A lower pKa means a stronger acid</title><desc>Aqueous approximate pKa comparison; values depend on conditions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<line x1="100" y1="220" x2="860" y2="220" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="190" y1="205" x2="190" y2="235" stroke="#153747" stroke-width="3"/>
<text x="190" y="165" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">ethanoic acid</text>
<text x="190" y="275" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">4.8</text>
<line x1="430" y1="205" x2="430" y2="235" stroke="#153747" stroke-width="3"/>
<text x="430" y="165" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">phenol</text>
<text x="430" y="275" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">10</text>
<line x1="740" y1="205" x2="740" y2="235" stroke="#153747" stroke-width="3"/>
<text x="740" y="165" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">ethanol</text>
<text x="740" y="275" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">16</text>
<text x="480" y="90" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#153747" text-anchor="middle" font-weight="normal">Approximate aqueous pKa</text>
<text x="480" y="345" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">Stronger acid ←                         → Weaker acid</text>
</svg>