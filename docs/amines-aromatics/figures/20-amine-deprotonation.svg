<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>High pH removes the ammonium proton</title><desc>High pH removes the ammonium proton</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="115" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">H₃N⁺–CH₂–COO⁻ + OH⁻</text>
<line x1="480" y1="145" x2="480" y2="225" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="275" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">H₂N–CH₂–COO⁻ + H₂O</text>
<text x="480" y="355" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="middle" font-weight="normal">Nitrogen goes from four bonds/+1 to three bonds/0; net charge is conserved.</text>
</svg>