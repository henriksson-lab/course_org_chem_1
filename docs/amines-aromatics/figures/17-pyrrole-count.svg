<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Pyrrole contributes two electrons from nitrogen</title><desc>Pyrrole contributes two electrons from nitrogen</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="80" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">Two C=C units + one N lone pair</text>
<circle cx="170.0" cy="185" r="10" stroke="#176b91" fill="#176b91" stroke-width="3"/>
<circle cx="210.0" cy="185" r="10" stroke="#176b91" fill="#176b91" stroke-width="3"/>
<circle cx="250.0" cy="185" r="10" stroke="#176b91" fill="#176b91" stroke-width="3"/>
<circle cx="290.0" cy="185" r="10" stroke="#176b91" fill="#176b91" stroke-width="3"/>
<text x="230" y="265" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">C=C electrons</text>
<circle cx="690.0" cy="185" r="10" stroke="#176b91" fill="#176b91" stroke-width="3"/>
<circle cx="730.0" cy="185" r="10" stroke="#176b91" fill="#176b91" stroke-width="3"/>
<text x="710" y="265" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">N pair electrons</text>
<text x="480" y="350" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#153747" text-anchor="middle" font-weight="normal">4 + 2 = 6 π electrons; do not count the pair twice.</text>
</svg>