<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Tertiary amine and quaternary ammonium differ</title><desc>Tertiary amine and quaternary ammonium differ</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="245" y="160" font-family="DejaVu Sans, sans-serif" font-size="38" fill="#153747" text-anchor="middle" font-weight="normal">(CH₃)₃N:</text>
<text x="730" y="160" font-family="DejaVu Sans, sans-serif" font-size="38" fill="#153747" text-anchor="middle" font-weight="normal">(CH₃)₄N⁺</text>
<text x="245" y="255" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">3 carbon groups; lone pair</text>
<text x="730" y="255" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">4 carbon groups; no lone pair</text>
<text x="480" y="355" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">Do not classify the charge by the word tertiary alone.</text>
</svg>