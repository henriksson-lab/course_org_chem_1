<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Predictions can reject a plausible-looking candidate</title><desc>Predictions can reject a plausible-looking candidate</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="110" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">Butanoic acid predicts: acid O–H + terminal ethyl + CH₂–COOH</text>
<text x="480" y="195" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">U1 shows: no broad O–H + O–CH₂ quartet + acetyl singlet</text>
<line x1="160" y1="265" x2="800" y2="265" stroke="#af3b45" stroke-width="4"/>
<text x="480" y="330" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">Reject the acid candidate using several independent observations.</text>
</svg>