<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>A hydroxyketone is another formula-compatible candidate</title><desc>A hydroxyketone is another formula-compatible candidate</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="140" font-family="DejaVu Sans, sans-serif" font-size="38" fill="#153747" text-anchor="middle" font-weight="normal">CH₃–C(=O)–CH(OH)–CH₃</text>
<text x="250" y="250" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">one OH-bearing CH, not CH₂</text>
<text x="720" y="250" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">methyl next to one H</text>
<text x="480" y="345" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="middle" font-weight="normal">C₄H₈O₂ fits, but the supplied 2H quartet/3H triplet pattern does not.</text>
</svg>