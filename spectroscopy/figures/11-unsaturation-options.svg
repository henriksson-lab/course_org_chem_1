<text x="250" y="290" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">One double bond: 1</text>
<text x="710" y="290" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">One saturated ring: 1</text>
<text x="480" y="360" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="middle" font-weight="normal">DBE alone does not locate the unsaturation or identify a functional group.</text>
