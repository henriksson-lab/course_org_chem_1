<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>One degree of unsaturation can be a ring or a double bond</title><desc>One degree of unsaturation can be a ring or a double bond</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="250" y="150" font-family="DejaVu Sans, sans-serif" font-size="44" fill="#153747" text-anchor="middle" font-weight="normal">C=O</text>
<line x1="640" y1="100" x2="780" y2="100" stroke="#153747" stroke-width="3"/>
<line x1="780" y1="100" x2="780" y2="240" stroke="#153747" stroke-width="3"/>
<line x1="780" y1="240" x2="640" y2="240" stroke="#153747" stroke-width="3"/>
