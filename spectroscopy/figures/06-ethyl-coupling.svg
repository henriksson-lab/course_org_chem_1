<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>An ethyl group gives a linked quartet and triplet</title><desc>An ethyl group gives a linked quartet and triplet</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="90" font-family="DejaVu Sans, sans-serif" font-size="43" fill="#153747" text-anchor="middle" font-weight="normal">CH₃–CH₂–O–</text>
<text x="245" y="145" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">CH₃ sees two neighbouring H</text>
<text x="715" y="145" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">CH₂ sees three neighbouring H</text>
