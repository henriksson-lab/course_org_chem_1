<line x1="650" y1="310" x2="650" y2="265" stroke="#23765d" stroke-width="5"/>
<line x1="690" y1="310" x2="690" y2="175" stroke="#23765d" stroke-width="5"/>
<line x1="730" y1="310" x2="730" y2="175" stroke="#23765d" stroke-width="5"/>
<line x1="770" y1="310" x2="770" y2="265" stroke="#23765d" stroke-width="5"/>
<text x="220" y="355" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">triplet, integral 3H</text>
<text x="710" y="355" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">quartet, integral 2H</text>
</svg>