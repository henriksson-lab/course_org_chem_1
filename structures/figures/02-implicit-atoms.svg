<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Counting the hidden carbons and hydrogens in pentane</title><desc>Counting the hidden carbons and hydrogens in pentane</desc>
