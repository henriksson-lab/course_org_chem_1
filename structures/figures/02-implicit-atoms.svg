<text x="480" y="330" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">5 carbons; 3 + 2 + 2 + 2 + 3 = 12 hydrogens → C₅H₁₂</text>
