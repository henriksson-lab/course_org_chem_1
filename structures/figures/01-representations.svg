<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Ethanol in three complementary representations</title><desc>Ethanol in three complementary representations</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="175" y="130" font-family="DejaVu Sans, sans-serif" font-size="40" fill="#153747" text-anchor="middle" font-weight="normal">C₂H₆O</text>
<text x="175" y="235" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">molecular formula</text>
<text x="480" y="130" font-family="DejaVu Sans, sans-serif" font-size="35" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH₂OH</text>
<text x="480" y="235" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">condensed structure</text>
<line x1="690" y1="160" x2="750" y2="110" stroke="#153747" stroke-width="3"/>
<line x1="750" y1="110" x2="800" y2="140" stroke="#153747" stroke-width="3"/>
<text x="825" y="160" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">OH</text>
<text x="775" y="235" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">skeletal structure</text>
<text x="480" y="335" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">Connectivity is visible in the last two representations.</text>
</svg>