<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Assign S to this Fischer projection of lactic acid</title><desc>Assign S to this Fischer projection of lactic acid</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<line x1="175" y1="175" x2="315" y2="175" stroke="#153747" stroke-width="3"/>
<line x1="245" y1="110" x2="245" y2="240" stroke="#153747" stroke-width="3"/>
<text x="140" y="183" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">OH (1)</text>
<text x="350" y="183" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">H (4)</text>
<text x="245" y="90" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">COOH (2)</text>
<text x="245" y="280" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">CH₃ (3)</text>
<text x="705" y="115" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">1 → 2 → 3 appears clockwise</text>
<text x="705" y="180" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">4 points toward you: invert</text>
<text x="705" y="260" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#176b91" text-anchor="middle" font-weight="normal">Configuration = S</text>
<text x="480" y="375" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">With 4 pointing away, clockwise would mean R.</text>
</svg>