<text x="245" y="105" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">95% R</text>
<text x="715" y="105" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">5% S</text>
<text x="480" y="290" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">ee = 90% in favour of R</text>
<text x="480" y="355" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">R% + S% = 100; ee = |R% − S%|</text>
