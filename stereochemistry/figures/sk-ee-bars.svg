<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img"><title>Enantiomeric excess as a bar</title><desc>Bars for 50:50, 70:30 and 95:5 R:S mixtures; the matched R/S pairs form a racemic part and the leftover R is the excess</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="420" rx="12" fill="#f7fafc"/>
<text x="210" y="100" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="end" font-weight="bold">50 : 50</text>
<rect x="230.0" y="70" width="560.0" height="44" rx="8" fill="#d4dee3" stroke="none"/>
<text x="510.0" y="100" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="middle" font-weight="normal">racemic 100%</text>
<text x="804" y="100" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#176b91" text-anchor="start" font-weight="bold">ee 0%</text>
<text x="210" y="205" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="end" font-weight="bold">70 : 30</text>
<rect x="230" y="175" width="224.0" height="44" rx="8" fill="#176b91" stroke="none"/>
<rect x="454.0" y="175" width="336.0" height="44" rx="8" fill="#d4dee3" stroke="none"/>
<text x="342.0" y="205" font-family="DejaVu Sans, sans-serif" font-size="21" fill="white" text-anchor="middle" font-weight="bold">excess R 40%</text>
<text x="622.0" y="205" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="middle" font-weight="normal">racemic 60%</text>
<text x="804" y="205" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#176b91" text-anchor="start" font-weight="bold">ee 40%</text>
<text x="210" y="310" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="end" font-weight="bold">95 : 5</text>
<rect x="230" y="280" width="504.0" height="44" rx="8" fill="#176b91" stroke="none"/>
<rect x="734.0" y="280" width="56.0" height="44" rx="8" fill="#d4dee3" stroke="none"/>
<text x="482.0" y="310" font-family="DejaVu Sans, sans-serif" font-size="21" fill="white" text-anchor="middle" font-weight="bold">excess R 90%</text>
<text x="762.0" y="310" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="middle" font-weight="normal"></text>
<text x="804" y="310" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#176b91" text-anchor="start" font-weight="bold">ee 90%</text>
<text x="480" y="395" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#5b6f7a" text-anchor="middle" font-weight="normal">Pair every S with one R. Whatever R is left over is the excess.</text>
</svg>