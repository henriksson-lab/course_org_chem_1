<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Atomic number resolves the first comparison</title><desc>Atomic number resolves the first comparison</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="245" y="175" font-family="DejaVu Sans, sans-serif" font-size="33" fill="#153747" text-anchor="middle" font-weight="normal">Br &gt; Cl &gt; O &gt; N &gt; C &gt; H</text>
<text x="715" y="175" font-family="DejaVu Sans, sans-serif" font-size="33" fill="#153747" text-anchor="middle" font-weight="normal">OH &gt; COOH &gt; CH₃ &gt; H</text>
<text x="245" y="270" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">compare attached atoms first</text>
<text x="715" y="270" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">then resolve carbon tie</text>
</svg>