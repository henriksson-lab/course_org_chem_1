<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img"><title>A Fischer projection and the 3D shape it stands for</title><desc>Fischer projection of (S)-lactic acid next to the same molecule with horizontal bonds as wedges and vertical bonds as hashes</desc>
