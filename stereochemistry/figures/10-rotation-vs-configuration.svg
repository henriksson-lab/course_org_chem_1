<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Configuration and optical rotation answer different questions</title><desc>Configuration and optical rotation answer different questions</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="250" y="110" font-family="DejaVu Sans, sans-serif" font-size="43" fill="#153747" text-anchor="middle" font-weight="normal">R / S</text>
<text x="250" y="185" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">arrangement of substituents</text>
<line x1="510" y1="70" x2="510" y2="310" stroke="#176b91" stroke-width="3" stroke-dasharray="8 8"/>
<text x="725" y="110" font-family="DejaVu Sans, sans-serif" font-size="43" fill="#153747" text-anchor="middle" font-weight="normal">(+) / (−)</text>
<text x="725" y="185" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">measured optical rotation</text>
<line x1="630" y1="260" x2="820" y2="260" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M 660 290 Q 725 220 790 290" stroke="#23765d" stroke-width="3" fill="none"/>
<text x="480" y="360" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">R does not mean (+); S does not mean (−).</text>
</svg>