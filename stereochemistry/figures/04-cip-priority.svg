<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>CIP priority begins at the directly attached atom</title><desc>CIP priority begins at the directly attached atom</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="160" font-family="DejaVu Sans, sans-serif" font-size="36" fill="#153747" text-anchor="middle" font-weight="normal">OH  &gt;  COOH  &gt;  CH₃  &gt;  H</text>
<text x="175" y="95" font-family="DejaVu Sans, sans-serif" font-size="33" fill="#176b91" text-anchor="middle" font-weight="normal">1</text>
<text x="175" y="255" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="middle" font-weight="normal">O beats C</text>
<text x="400" y="95" font-family="DejaVu Sans, sans-serif" font-size="33" fill="#176b91" text-anchor="middle" font-weight="normal">2</text>
<text x="400" y="255" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="middle" font-weight="normal">C attached to O,O,O</text>
<text x="625" y="95" font-family="DejaVu Sans, sans-serif" font-size="33" fill="#176b91" text-anchor="middle" font-weight="normal">3</text>
<text x="625" y="255" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="middle" font-weight="normal">C attached to H,H,H</text>
<text x="835" y="95" font-family="DejaVu Sans, sans-serif" font-size="33" fill="#176b91" text-anchor="middle" font-weight="normal">4</text>
<text x="835" y="255" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="middle" font-weight="normal">H is lowest</text>
<text x="480" y="340" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">A double bond is counted using duplicate atoms for the comparison.</text>
</svg>