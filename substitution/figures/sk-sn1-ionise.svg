<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img"><title>SN1 starts with ionisation to a carbocation</title><desc>Top: the C-Br bond of 2-bromo-2-methylpropane breaks with both electrons going to bromine, giving the tert-butyl cation and bromide. Bottom: carbocation stability rises from methyl to tertiary.</desc>
