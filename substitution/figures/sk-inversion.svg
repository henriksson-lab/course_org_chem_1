<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Backside attack inverts (S)-2-bromobutane to (R)-butan-2-ol</title><desc>Hydroxide attacks C2 of (S)-2-bromobutane opposite bromine. The three other groups flip like an umbrella, giving (R)-butan-2-ol. CIP priority numbers are shown at each group.</desc>
