<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img"><title>Protonating ethanol turns OH into a water leaving group</title><desc>Step 1: ethanol takes a proton from hydronium to give the ethyloxonium ion. Step 2: bromide attacks carbon in an SN2 step and neutral water leaves, giving bromoethane.</desc>
