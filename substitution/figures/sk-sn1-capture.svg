<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img"><title>Water captures the carbocation, then a second water removes a proton</title><desc>Step 2: a lone pair on water bonds to the cationic carbon, giving a protonated alcohol with a three-bonded, positive oxygen. Step 3: another water takes a proton, giving tert-butanol and hydronium.</desc>
