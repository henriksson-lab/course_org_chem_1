<text x="480" y="330" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">Specific 2-bromobutane → butan-2-ol SN2 example</text>
<text x="480" y="375" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">Inversion is geometric; descriptor changes require a fresh priority check.</text>
</svg>