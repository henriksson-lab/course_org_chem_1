<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Follow retained groups and then reassess CIP priority</title><desc>Follow retained groups and then reassess CIP priority</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="240" y="115" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">Br &gt; ethyl &gt; methyl &gt; H</text>
<text x="240" y="220" font-family="DejaVu Sans, sans-serif" font-size="58" fill="#176b91" text-anchor="middle" font-weight="normal">S</text>
<text x="720" y="115" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">OH &gt; ethyl &gt; methyl &gt; H</text>
<text x="720" y="220" font-family="DejaVu Sans, sans-serif" font-size="58" fill="#176b91" text-anchor="middle" font-weight="normal">R</text>
