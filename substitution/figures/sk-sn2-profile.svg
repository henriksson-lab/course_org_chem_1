<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>SN2 energy profile: one step, one transition state</title><desc>Energy against reaction progress rises to a single maximum, the transition state with partial O-C and C-Br bonds, then falls to products.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<line x1="90" y1="340" x2="90" y2="40" stroke="#153747" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="90" y1="340" x2="600" y2="340" stroke="#153747" stroke-width="3" marker-end="url(#arrow)"/>
<text x="68" y="190.0" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" transform="rotate(-90 68 190.0)">energy</text>
<text x="345.0" y="372" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">reaction progress</text>
<path d="M 105 230 C 200 230 245 95 330 95 C 415 95 470 270 590 270" stroke="#176b91" stroke-width="4" fill="none"/>
<text x="105" y="262" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="start" font-weight="normal">HO⁻ + CH₃Br</text>
<text x="590" y="302" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="end" font-weight="normal">CH₃OH + Br⁻</text>
<text x="330" y="78" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#af3b45" text-anchor="middle" font-weight="bold">transition state ‡</text>
<line x1="185" y1="230" x2="185" y2="95" stroke="#153747" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="185" y1="95" x2="320" y2="95" stroke="#153747" stroke-width="2" stroke-dasharray="6 5"/>
<text x="175" y="172" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="end" font-weight="normal">Eₐ</text>
<text x="790" y="70" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="bold">the structure at the top</text>
<line x1="790.0" y1="186.4" x2="790.0" y2="156.64" stroke="#153747" stroke-width="3"/>
<text x="790" y="152" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">H</text>
<line x1="775.6" y1="217.0" x2="752.56" y2="236.2" stroke="#153747" stroke-width="3"/>
<text x="742" y="254" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">H</text>
<line x1="804.4" y1="217.0" x2="827.44" y2="236.2" stroke="#153747" stroke-width="3"/>
<text x="838" y="254" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">H</text>
<text x="790" y="214" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#153747" text-anchor="middle" font-weight="normal">C</text>
<line x1="768" y1="205" x2="702" y2="205" stroke="#153747" stroke-width="3" stroke-dasharray="7 6"/>
<line x1="812" y1="205" x2="878" y2="205" stroke="#153747" stroke-width="3" stroke-dasharray="7 6"/>
<text x="672" y="215" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#af3b45" text-anchor="middle" font-weight="normal">HO</text>
<text x="672" y="179" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#176b91" text-anchor="middle" font-weight="normal">δ−</text>
<text x="905" y="215" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#7a3b2e" text-anchor="middle" font-weight="normal">Br</text>
<text x="905" y="179" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#176b91" text-anchor="middle" font-weight="normal">δ−</text>
<text x="625" y="225" font-family="DejaVu Sans, sans-serif" font-size="64" fill="#153747" text-anchor="middle" font-weight="normal">[</text>
<text x="952" y="225" font-family="DejaVu Sans, sans-serif" font-size="64" fill="#153747" text-anchor="middle" font-weight="normal">]</text>
<text x="974" y="179" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">‡</text>
<text x="790" y="310" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#176b91" text-anchor="middle" font-weight="normal">C–O half made, C–Br half broken</text>
<text x="790" y="340" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#176b91" text-anchor="middle" font-weight="normal">three H flat, like an umbrella</text>
<text x="790" y="370" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#176b91" text-anchor="middle" font-weight="normal">caught turning inside out</text>
</svg>