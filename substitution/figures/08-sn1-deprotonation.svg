<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>A second water molecule removes a proton from oxonium</title><desc>A second water molecule removes a proton from oxonium</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="140" y="175" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">H₂O:</text>
<text x="470" y="175" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">H</text>
<text x="700" y="175" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">O⁺H—C(CH₃)₃</text>
<line x1="490" y1="165" x2="575" y2="165" stroke="#153747" stroke-width="3"/>
<path d="M 180 155 Q 300 55 455 150" stroke="#176b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 530 165 Q 570 240 605 195" stroke="#176b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="480" y="300" font-family="DejaVu Sans, sans-serif" font-size="33" fill="#153747" text-anchor="middle" font-weight="normal">(CH₃)₃COH + H₃O⁺</text>
<text x="480" y="355" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">Proton transfer restores a neutral alcohol.</text>
</svg>