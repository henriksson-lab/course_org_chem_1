<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>A nonunit coefficient changes the limiting comparison</title><desc>A nonunit coefficient changes the limiting comparison</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="85" font-family="DejaVu Sans, sans-serif" font-size="37" fill="#153747" text-anchor="middle" font-weight="normal">2 A + B → P</text>
<text x="240" y="180" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">12 mmol ÷ 2</text>
<text x="240" y="270" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">6 mmol reaction extent</text>
<text x="720" y="180" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">8 mmol ÷ 1</text>
<text x="720" y="270" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#153747" text-anchor="middle" font-weight="normal">8 mmol reaction extent</text>
<text x="480" y="355" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">A limits the maximum P to 6 mmol despite having more mmol initially.</text>
</svg>