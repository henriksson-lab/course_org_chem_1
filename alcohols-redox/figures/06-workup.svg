<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>A proton donor converts the alkoxide to alcohol</title><desc>A proton donor converts the alkoxide to alcohol</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="230" y="190" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">(CH₃)₂CHO⁻ + H₂O</text>
<text x="730" y="190" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="middle" font-weight="normal">(CH₃)₂CHOH + OH⁻</text>
<line x1="410" y1="180" x2="550" y2="180" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="125" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">proton transfer</text>
<text x="480" y="330" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">A separate proton-transfer step follows carbonyl reduction.</text>
</svg>