<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Theoretical yield is capped by stoichiometric availability</title><desc>Theoretical yield is capped by stoichiometric availability</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<rect x="160" y="160" width="120" height="140" rx="8" fill="#2c7894" stroke="none"/>
<text x="220" y="340" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="middle" font-weight="normal">10.0 mmol acid</text>
<rect x="420" y="90" width="120" height="210" rx="8" fill="#2c7894" stroke="none"/>
<text x="480" y="340" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="middle" font-weight="normal">15.0 mmol anhydride</text>
<rect x="680" y="160" width="120" height="140" rx="8" fill="#2c7894" stroke="none"/>
<text x="740" y="340" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="middle" font-weight="normal">10.0 mmol product max</text>
<line x1="100" y1="300" x2="870" y2="300" stroke="#153747" stroke-width="3"/>
<text x="480" y="65" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#153747" text-anchor="middle" font-weight="normal">Supplied balanced 1:1 teaching reaction</text>
<text x="480" y="390" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="middle" font-weight="normal">Amount divided by stoichiometric coefficient identifies the limiting reagent.</text>
</svg>