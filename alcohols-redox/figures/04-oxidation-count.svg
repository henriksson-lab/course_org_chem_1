<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Oxidation state counts C—O and C—H bonds differently</title><desc>Oxidation state counts C—O and C—H bonds differently</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="180" y="145" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH₂OH</text>
<text x="180" y="235" font-family="DejaVu Sans, sans-serif" font-size="42" fill="#176b91" text-anchor="middle" font-weight="normal">−1</text>
<text x="480" y="145" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CHO</text>
<text x="480" y="235" font-family="DejaVu Sans, sans-serif" font-size="42" fill="#176b91" text-anchor="middle" font-weight="normal">+1</text>
<text x="780" y="145" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#153747" text-anchor="middle" font-weight="normal">CH₃COOH</text>
<text x="780" y="235" font-family="DejaVu Sans, sans-serif" font-size="42" fill="#176b91" text-anchor="middle" font-weight="normal">+3</text>
<text x="480" y="320" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">For the changing carbon: each C—O bond order +1; each C—H −1.</text>
<text x="480" y="365" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">C—C bonds contribute zero; oxidation raises the assigned value.</text>
</svg>