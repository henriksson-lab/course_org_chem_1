<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>A two-step pathway regenerates its base catalyst</title><desc>A two-step pathway regenerates its base catalyst</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="480" y="95" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CHO + OH⁻ → CH₃CH(OH)O⁻</text>
<text x="480" y="200" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#153747" text-anchor="middle" font-weight="normal">CH₃CH(OH)O⁻ + H₂O → CH₃CH(OH)₂ + OH⁻</text>
<line x1="140" y1="250" x2="820" y2="250" stroke="#23765d" stroke-width="3"/>
<text x="480" y="320" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">Net: CH₃CHO + H₂O ⇌ CH₃CH(OH)₂</text>
</svg>