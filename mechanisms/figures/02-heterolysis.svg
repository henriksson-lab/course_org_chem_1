<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Heterolysis gives both bonding electrons to one atom</title><desc>Heterolysis gives both bonding electrons to one atom</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="235" y="165" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">CH₃</text>
<text x="410" y="165" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">Br</text>
<line x1="280" y1="155" x2="370" y2="155" stroke="#153747" stroke-width="3"/>
<path d="M 325 155 Q 375 70 410 120" stroke="#176b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="700" y="165" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#153747" text-anchor="middle" font-weight="normal">CH₃⁺ + Br⁻</text>
<line x1="470" y1="155" x2="555" y2="155" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480" y="285" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#153747" text-anchor="middle" font-weight="normal">A bookkeeping example of heterolysis</text>
<text x="480" y="335" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#153747" text-anchor="middle" font-weight="normal">This drawing does not claim methyl bromide readily forms CH₃⁺.</text>
</svg>