<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Ammonia accepts a proton from hydrogen chloride</title><desc>Ammonia accepts a proton from hydrogen chloride</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="160" y="180" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#153747" text-anchor="middle" font-weight="normal">NH₃:</text>
<text x="500" y="180" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#153747" text-anchor="middle" font-weight="normal">H</text>
<text x="770" y="180" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#153747" text-anchor="middle" font-weight="normal">Cl</text>
<line x1="525" y1="170" x2="730" y2="170" stroke="#153747" stroke-width="3"/>
<path d="M 205 155 Q 330 65 480 150" stroke="#176b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 625 170 Q 715 245 755 200" stroke="#176b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="480" y="305" font-family="DejaVu Sans, sans-serif" font-size="35" fill="#153747" text-anchor="middle" font-weight="normal">NH₄⁺ + Cl⁻</text>
<text x="480" y="365" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">A neutral base becomes a cation after accepting H⁺.</text>
</svg>