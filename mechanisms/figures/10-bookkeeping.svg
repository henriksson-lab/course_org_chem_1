<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Check atom identity and total charge after a step</title><desc>Check atom identity and total charge after a step</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="210" y="130" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">HO⁻ + CH₃Br</text>
<text x="735" y="130" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">CH₃OH + Br⁻</text>
<line x1="420" y1="120" x2="540" y2="120" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<text x="240" y="230" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">C₁  H₄  O₁  Br₁</text>
<text x="240" y="300" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#153747" text-anchor="middle" font-weight="normal">total charge −1</text>
<text x="720" y="230" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#153747" text-anchor="middle" font-weight="normal">C₁  H₄  O₁  Br₁</text>
<text x="720" y="300" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#153747" text-anchor="middle" font-weight="normal">total charge −1</text>
<text x="480" y="365" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">Electrons move; atoms are neither created nor silently removed.</text>
</svg>