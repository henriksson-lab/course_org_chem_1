<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Substitution forms one bond while another breaks</title><desc>Substitution forms one bond while another breaks</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<text x="140" y="195" font-family="DejaVu Sans, sans-serif" font-size="31" fill="#176b91" text-anchor="middle" font-weight="normal">:OH⁻</text>
<text x="425" y="195" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">CH₃</text>
<text x="690" y="195" font-family="DejaVu Sans, sans-serif" font-size="32" fill="#153747" text-anchor="middle" font-weight="normal">Br</text>
<line x1="475" y1="185" x2="650" y2="185" stroke="#153747" stroke-width="3"/>
<path d="M 105 165 Q 245 65 390 166" stroke="#176b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 565 185 Q 660 90 689 145" stroke="#176b91" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="480" y="315" font-family="DejaVu Sans, sans-serif" font-size="34" fill="#153747" text-anchor="middle" font-weight="normal">HO—CH₃ + Br⁻</text>
<text x="480" y="365" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#153747" text-anchor="middle" font-weight="normal">A concerted SN2 step: two arrows, no carbocation intermediate.</text>
</svg>