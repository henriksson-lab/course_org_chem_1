<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img"><title>Heterolysis of a C–Br bond: methyl versus tert-butyl</title><desc>Both C–Br bond pairs move to bromine on paper. The methyl cation is far too unstable to form, while the tert-butyl cation does form in polar solvents, which is SN1 in Week 3.</desc>
