<text x="470" y="219" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="start" font-weight="normal">③ flat, so the p orbitals overlap</text>
<text x="470" y="271" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#153747" text-anchor="start" font-weight="normal">④ 4n + 2 π electrons: 2, 6, 10, …</text>
<text x="470" y="345" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#23765d" text-anchor="start" font-weight="bold">benzene: 2 + 2 + 2 = 6 = 4(1) + 2</text>
