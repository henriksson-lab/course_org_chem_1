<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img"><title>Two pKa values produce three glycine charge regions</title><desc>Two pKa values produce three glycine charge regions</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b91"/></marker></defs>
<rect width="960" height="400" rx="12" fill="#f7fafc"/>
<line x1="100" y1="220" x2="870" y2="220" stroke="#176b91" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="230" y1="195" x2="230" y2="245" stroke="#af3b45" stroke-width="3"/>
<text x="230" y="280" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">pKa 2.3</text>
<line x1="680" y1="195" x2="680" y2="245" stroke="#af3b45" stroke-width="3"/>
<text x="680" y="280" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#153747" text-anchor="middle" font-weight="normal">pKa 9.6</text>
<text x="160" y="140" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#153747" text-anchor="middle" font-weight="normal">net +1</text>
<text x="450" y="140" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#153747" text-anchor="middle" font-weight="normal">net 0: zwitterion</text>
<text x="790" y="140" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#153747" text-anchor="middle" font-weight="normal">net −1</text>
<text x="480" y="350" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#153747" text-anchor="middle" font-weight="normal">pH increases left to right; neighbouring forms coexist near each pKa.</text>
</svg>